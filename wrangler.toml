# Cloudflare Pages configuration for coverline-store.
# Bindings + plain-text vars live here (source of truth); SECRETS stay in the Pages
# dashboard (Settings → Variables and secrets, type Secret) and are never in this repo.
# Local dev secrets (Stripe test key, etc.) go in .dev.vars instead — also gitignored.
name = "coverline-store"
pages_build_output_dir = "."
compatibility_date = "2026-09-08"

[vars]
AGENTMAIL_INBOX = "coverlineshop@agentmail.to"

[[kv_namespaces]]
binding = "ORDERS"
id = "93f09a61dfde4ca9ad1912170aab762d"
