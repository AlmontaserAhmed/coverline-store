<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">Coverline</title>
<meta name="description" id="pageDesc" content="">
<link rel="canonical" href="https://coverlineshop.com/product.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23180f12%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27Georgia,serif%27 font-style=%27italic%27 font-size=%2740%27 text-anchor=%27middle%27 fill=%27%23f2e6df%27%3EC%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Coverline">
<meta property="og:title" content="Coverline">
<meta property="og:description" content="">
<meta property="og:url" content="https://coverlineshop.com/product.html">
<meta property="og:image" content="https://coverlineshop.com/assets/product-images/tee-apricot.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/style.css?v=9">
</head>
<body>

<header class="wrap">
  <div class="headerbar">
    <a class="wordmark" href="/">Coverline</a>
    <nav>
      <a href="/#shop">Shop</a>
      <a class="quiet" href="/#story">Our Story</a>
      <a class="quiet" href="/shipping-returns.html">Shipping &amp; Returns</a>
      <span data-cart-slot></span>
    </nav>
  </div>
</header>

<main>
  <section class="pdp">
    <div class="wrap">
      <div class="pdp-breadcrumb"><a href="/#shop">&larr; Back to The Edit</a></div>
      <div class="pdp-grid">
        <div class="pdp-media">
          <div class="swatch" id="pdpSwatch"></div>
          <div class="pdp-thumbs" id="pdpThumbs" hidden></div>
        </div>
        <div class="pdp-info" id="pdpInfo">
          <!-- filled by script -->
        </div>
      </div>

      <section class="pdp-reviews" id="pdpReviews" hidden>
        <h2>From people who bought it</h2>
        <div class="reviews-list" id="reviewsList"></div>
      </section>

      <section class="pdp-faq" id="pdpFaq">
        <h2>Before you ask</h2>
        <dl class="faq-list" id="faqList"></dl>
      </section>

      <div class="pdp-other">
        <h2>More from the edit</h2>
        <div class="shop-grid" id="otherGrid"></div>
      </div>
    </div>
  </section>
</main>

<footer class="wrap">
  <span class="wordmark">Coverline</span>
  <p>London, United Kingdom — <a href="mailto:coverlineshop@agentmail.to">coverlineshop@agentmail.to</a></p>
  <div class="foot-links">
    <a href="/shipping-returns.html">Shipping &amp; Returns</a>
    <a href="/terms.html">Terms</a>
    <a href="/privacy.html">Privacy</a>
    <a href="https://www.instagram.com/coverlineshop" target="_blank" rel="noopener">Instagram</a>
  </div>
</footer>

<script src="/assets/products.js?v=19"></script>
<script src="/assets/sizecharts.js?v=2"></script>
<script src="/assets/reviews.js?v=1"></script>
<script src="/assets/config.js?v=2"></script>
<script src="/assets/cart.js?v=5"></script>
<script>
(function(){
  var PRODUCTS = window.COVERLINE_PRODUCTS;
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || PRODUCTS[0].id;
  var p = window.CoverlineCart.productById(id) || PRODUCTS[0];
  var qty = 1;
  var chosenSize = null;
  // Store-review pass (12 Sep 2026): no colour pre-selected on load — the page used
  // to default to colors[0] and mark it pressed before you'd touched anything, which
  // both looked like a choice you didn't make and let "Add to bag" silently ship
  // whatever the first colour was if you never picked one. Now nothing is pressed
  // until you click a swatch, and add-to-bag is blocked (like size) until you do.
  var chosenColor = null;

  document.getElementById('pageTitle').textContent = p.name + ' — Coverline';
  (function(){
    var set=function(sel,attr,val){ var el=document.querySelector(sel); if(el) el.setAttribute(attr,val); };
    var url='https://coverlineshop.com/product.html?id='+encodeURIComponent(p.id);
    set('link[rel=canonical]','href',url); set('meta[property="og:url"]','content',url);
    set('meta[property="og:title"]','content',p.name+' — Coverline');
    set('meta[property="og:description"]','content',p.desc);
    set('meta[property="og:image"]','content','https://coverlineshop.com'+(p.image||'').split('?')[0]);
  })();
  document.getElementById('pageDesc').setAttribute('content', p.desc);

  var activeImg = 0;
  function galleryImages(){
    if(chosenColor && chosenColor.images && chosenColor.images.length) return chosenColor.images;
    var single = (chosenColor && chosenColor.image) || p.image;
    return single ? [single] : [];
  }
  function renderThumbs(){
    var wrap = document.getElementById('pdpThumbs');
    var imgs = galleryImages();
    if(imgs.length < 2){ wrap.hidden = true; wrap.innerHTML = ''; return; }
    wrap.hidden = false;
    wrap.innerHTML = imgs.map(function(src, i){
      return '<button type="button" class="thumb" data-i="' + i + '" aria-pressed="' + (i === activeImg) + '" aria-label="View image ' + (i+1) + '"><img src="' + src + '" alt=""></button>';
    }).join('');
    wrap.querySelectorAll('.thumb').forEach(function(b){
      b.addEventListener('click', function(){
        activeImg = parseInt(b.getAttribute('data-i'), 10);
        renderMedia();
      });
    });
  }
  function renderMedia(){
    var imgs = galleryImages();
    if(activeImg >= imgs.length) activeImg = 0;
    var img = imgs[activeImg];
    var newHtml = img ? ('<img src="' + img + '" alt="' + p.name + (chosenColor ? ' — ' + chosenColor.label : '') + '">') : ('<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">' + p.swatch() + '</svg>');
    renderThumbs();
    var container = document.getElementById('pdpSwatch');
    var layer = document.createElement('div');
    layer.innerHTML = newHtml;
    layer.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .3s ease;';
    if (!container.style.position) container.style.position = 'relative';
    container.appendChild(layer);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ layer.style.opacity = '1'; });
    });
    setTimeout(function(){
      Array.prototype.slice.call(container.children).forEach(function(el){
        if (el !== layer) el.parentNode.removeChild(el);
      });
      layer.style.cssText = '';
    }, 320);
  }
  renderMedia();

  function renderInfo(){
    var sizesHtml = p.sizes.map(function(s){
      var pressed = chosenSize === s;
      return '<button type="button" class="size-btn" data-size="' + s + '" aria-pressed="' + pressed + '">' + s + '</button>';
    }).join('');

    document.getElementById('pdpInfo').innerHTML =
      '<h1>' + p.name + '</h1>' +
      '<p class="tagline">' + p.tagline + '</p>' +
      '<p class="price">' + p.priceLabel + '</p>' +
      '<span class="proof">' + p.proof + '</span>' +
      '<p class="longdesc">' + p.longDesc + '</p>' +
      (p.colors && p.colors.length ? (
        '<div class="pdp-colors">' +
          '<div class="label" style="margin-bottom:10px;">Colour: ' + (chosenColor ? chosenColor.label : 'Pick a colour') + '</div>' +
          '<div class="colors" role="group" aria-label="Colour">' +
            p.colors.map(function(c){
              var pressed = !!(chosenColor && chosenColor.key === c.key);
              return '<button type="button" class="color-btn" data-color="' + c.key + '" aria-pressed="' + pressed + '" title="' + c.label + '" style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;margin-right:10px;background:' + c.hex + ';' + (pressed ? 'outline:2px solid var(--ink,#1a1a1a);outline-offset:2px;' : '') + '"></button>';
            }).join('') +
          '</div>' +
        '</div>'
      ) : '') +
      '<div class="pdp-sizes">' +
        '<div class="label" style="margin-bottom:10px;">Pick your size</div>' +
        '<div class="sizes" role="group" aria-label="Size">' + sizesHtml + '</div>' +
      '</div>' +
      '<div class="pdp-add">' +
        '<button type="button" class="btn" id="addToBagBtn">Add to bag — £' + p.price + '</button>' +
        '<p class="pdp-added-note" id="addedNote" hidden>In your bag. Keep browsing or check out when you\'re ready.</p>' +
        '<p class="trust-strip">Free tracked UK delivery (5&#8209;10 working days) &middot; 14&#8209;day no&#8209;post&#8209;back returns</p>' +
      '</div>' +
      '<div class="pdp-accordion">' +
        accItem('Fit &amp; sizing', '<p>' + p.fit + '</p>') +
        (sizeChartHtml() ? accItem('Size chart', sizeChartHtml()) : '') +
        accItem('Fabric &amp; care', '<p>Soft stretch fabric. Machine wash cold, hang or lay flat to dry. Skip the tumble dryer — it\'s what kills the stretch in every pair you\'ve owned before.</p>') +
        accItem('Shipping', '<p>UK delivery usually takes 5&ndash;10 working days &mdash; it comes from further away than the high street, and it\'s priced like it. We\'d rather say that now than promise next-day and miss it. You\'ll get a tracking link by email once it\'s on the way.</p><p><a href="/shipping-returns.html" class="link-quiet">Full shipping &amp; returns policy &rarr;</a></p>') +
        accItem('Returns', '<p>Wrong size, damaged, or not what you ordered? Email us within 14 days of delivery and we\'ll send a replacement or refund you &mdash; you never have to post anything back. Full detail in our <a href="/shipping-returns.html">returns policy</a>.</p>') +
      '</div>';

    document.getElementById('pdpInfo').querySelectorAll('.size-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        chosenSize = btn.getAttribute('data-size');
        renderInfo();
      });
    });
    document.getElementById('pdpInfo').querySelectorAll('.color-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-color');
        chosenColor = p.colors.filter(function(c){ return c.key === key; })[0] || chosenColor;
        activeImg = 0;
        renderMedia();
        renderInfo();
      });
    });
    document.getElementById('addToBagBtn').addEventListener('click', function(){
      if(p.colors && p.colors.length && !chosenColor){
        alert('Pick a colour first — tap one of the swatches above.');
        return;
      }
      if(!chosenSize){
        alert('Pick a size first — the fit note below will tell you which way to go if you\'re between two.');
        return;
      }
      window.CoverlineCart.add(p.id, chosenSize, qty, chosenColor ? chosenColor.key : null);
      var note = document.getElementById('addedNote');
      if(note) note.hidden = false;
    });

    document.querySelectorAll('.acc-trigger').forEach(function(btn){
      btn.addEventListener('click', function(){
        var expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', expanded ? 'false' : 'true');
        var panel = document.getElementById(btn.getAttribute('aria-controls'));
        if(panel) panel.hidden = expanded;
      });
    });
  }

  var accCount = 0;
  function accItem(title, bodyHtml){
    accCount++;
    var pid = 'acc-panel-' + accCount;
    return '' +
      '<div class="acc-item">' +
        '<button type="button" class="acc-trigger" aria-expanded="false" aria-controls="' + pid + '">' + title + '<span class="chev">+</span></button>' +
        '<div class="acc-panel" id="' + pid + '" hidden>' + bodyHtml + '</div>' +
      '</div>';
  }

  function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function sizeChartHtml(){
    var charts = window.COVERLINE_SIZE_CHARTS || {};
    var c = charts[p.id];
    if(!c || !c.rows || !c.rows.length) return '';
    var head = '<tr>' + c.columns.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>';
    var body = c.rows.map(function(r){ return '<tr>' + r.map(function(v, i){ return (i === 0 ? '<th scope="row">' : '<td>') + esc(v) + (i === 0 ? '</th>' : '</td>'); }).join('') + '</tr>'; }).join('');
    return '<div class="size-table-wrap"><table class="size-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="size-unit">Measurements in ' + esc(c.unit || 'cm') + '.' + (c.note ? ' ' + esc(c.note) : '') + '</p>';
  }

  function renderFaq(){
    var faqs = [
      ['Is it see-through?',
       'No. The legging and the short are the thick, seamless kind &mdash; "squat-tested" on the page means exactly that. The tee is a proper cotton weight, not a tissue tee. Nothing in this drop is sheer; that was the first filter when we picked the pieces.'],
      ['How long does delivery actually take?',
       'UK delivery is usually 5&ndash;10 working days. It comes from further away than the high street, which is also part of why the prices are what they are. You get a tracking link by email the moment it ships.'],
      ['I\'m between two sizes &mdash; which way do I go?',
       'The fit note above says for each piece. Short version: legging and short, size up if you want less compression; the tee is oversized on purpose, so size down if you want it closer to the body; the sets run true to size.'],
      ['What if it doesn\'t fit?',
       'Email us within 14 days of delivery and we\'ll sort a replacement or a refund. You don\'t post anything back. Full detail on the <a href="/shipping-returns.html">shipping &amp; returns</a> page.']
    ];
    document.getElementById('faqList').innerHTML = faqs.map(function(f){
      return '<div class="faq-item"><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>';
    }).join('');
  }

  function renderReviews(){
    var all = window.COVERLINE_REVIEWS || [];
    var mine = all.filter(function(r){ return r.product === p.id && r.quote; });
    var sec = document.getElementById('pdpReviews');
    if(!mine.length){ sec.hidden = true; return; }
    sec.hidden = false;
    document.getElementById('reviewsList').innerHTML = mine.map(function(r){
      var meta = [r.name, r.size ? 'size ' + r.size : '', r.height ? r.height : ''].filter(Boolean).map(esc).join(' &middot; ');
      return '<blockquote class="review"><p>&ldquo;' + esc(r.quote) + '&rdquo;</p><footer>' + meta + '</footer></blockquote>';
    }).join('');
  }

  renderInfo();
  renderFaq();
  renderReviews();

  // Other products grid
  var otherGrid = document.getElementById('otherGrid');
  otherGrid.innerHTML = PRODUCTS.filter(function(x){ return x.id !== p.id; }).map(function(op){
    return '' +
      '<div class="piece" data-id="' + op.id + '">' +
        '<a class="swatch-link" href="/product.html?id=' + op.id + '">' +
          '<div class="swatch">' + (op.image ? '<img src="' + op.image + '" alt="' + op.name + '" loading="lazy">' : '<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">' + op.swatch() + '</svg>') + '</div>' +
        '</a>' +
        '<h3><a href="/product.html?id=' + op.id + '">' + op.name + '</a></h3>' +
        '<p class="desc">' + op.desc + '</p>' +
        '<p class="price">' + op.priceLabel + '</p>' +
        '<a class="view-details" href="/product.html?id=' + op.id + '">Full details &amp; size guide &rarr;</a>' +
      '</div>';
  }).join('');
})();
</script>

</body>
</html>
